name: Build Grand APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходников
        uses: actions/checkout@v4

      - name: Установка Java 17 для SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Android SDK и NDK r21e
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;21.4.7075529'

      - name: Переключение на Java 11 для Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Права на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
