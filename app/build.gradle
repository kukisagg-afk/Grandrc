apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        applicationId "com.grand.game"
        versionName "veru-buil-launcher"
        versionCode 10
        vectorDrawables.useSupportLibrary = true

        multiDexEnabled = true

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }
}

dependencies {
    // --- Твои старые библиотеки ---
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'com.tuyenmonkey:mkloader:1.4.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "com.github.skydoves:colorpickerpreference:2.0.0"

    // --- Новые библиотеки (вместо тех, что перестали работать) ---
    // Вместо MaskedEditText
    implementation 'io.github.vicmikhailau:MaskedEditText:5.0.3'
    
    // Вместо CircleProgressBar
    implementation 'io.github.dinuscxj:circleprogressbar:1.4.1'
    
    // Вместо PRDownloader
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    
    // Вместо un7zip
    implementation files('libs/libp7zip-release.aar')'
}
